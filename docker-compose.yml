# ContextAI — full stack in one command:  docker compose up --build
#
# Requires Ollama running on the HOST machine (e.g. `ollama serve`). Backend
# services use host networking so they can reach the host's loopback Ollama at
# http://localhost:11434 without changing Ollama's bind address.
#
# After it's up:
#   UI        -> http://localhost:5173
#   WhatsApp  -> http://localhost:8002
#   Discord   -> http://localhost:8004
#   RAG       -> http://localhost:3000

services:
  rag:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: contextai-rag
    container_name: contextai-rag
    environment:
      OLLAMA_HOSTS: ${OLLAMA_HOSTS:-http://localhost:11434}
      RAG_STORE_FILE: /app/data/rag_store.json
      PORT: "3000"
    network_mode: host
    volumes:
      - rag-data:/app/data
    restart: unless-stopped

  whatsapp:
    build: ./backend
    image: contextai-backend
    container_name: contextai-whatsapp
    command: node whatsapp_api.js
    init: true
    shm_size: "1gb"
    environment:
      OLLAMA_HOSTS: ${OLLAMA_HOSTS:-http://localhost:11434}
      RAG_SERVER_URL: http://localhost:3000
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    network_mode: host
    volumes:
      - wa-auth:/app/.wwebjs_auth
      - wa-cache:/app/.wwebjs_cache
    depends_on:
      - rag
    restart: unless-stopped

  discord:
    build: ./backend
    image: contextai-backend
    container_name: contextai-discord
    command: node discord_api.js
    init: true
    environment:
      OLLAMA_HOSTS: ${OLLAMA_HOSTS:-http://localhost:11434}
      RAG_SERVER_URL: http://localhost:3000
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
    network_mode: host
    depends_on:
      - rag
    restart: unless-stopped

  ui:
    build: ./backend/whatsapp_ui
    image: contextai-ui
    container_name: contextai-ui
    ports:
      - "5173:80"
    depends_on:
      - whatsapp
      - discord
      - rag
    restart: unless-stopped

volumes:
  rag-data:
  wa-auth:
  wa-cache:
